services:
  postgres-userservice:
    container_name: postgres-userservice
    image: postgres:18.6-alpine3.23
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=userservice-merezh
    volumes:
      - userservice-data:/var/lib/postgresql
    networks:
      - dbnet
    restart: always


  postgres-authservice:
    container_name: postgres-authservice
    image: postgres:18.6-alpine3.23
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=authservice-merezh
    volumes:
      - authservice-data:/var/lib/postgresql
    networks:
      - dbnet
    restart: always
    depends_on:
      - postgres-userservice


  userservice-merezh:
    container_name: userservice-merezh
    build: ../userservice-merezh
    restart: always
    networks:
      - dbnet
    depends_on:
      - postgres-userservice


  authservice-merezh:
    container_name: authservice-merezh
    build: .
    restart: always
    networks:
      - dbnet
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - postgres-authservice
      - userservice-merezh

networks:
  dbnet:
    driver: bridge
volumes:
  userservice-data:
  authservice-data: